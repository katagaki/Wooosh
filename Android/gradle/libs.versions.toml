[versions]
activity-compose = "1.13.0"
agp = "9.3.1"
compose-bom = "2026.05.00"
core-ktx = "1.18.0"
coroutines = "1.11.0"
datastore = "1.2.1"
jna = "5.19.1"
kotlin = "2.3.21"
lifecycle = "2.10.0"
zxing-core = "3.5.3"
zxing-embedded = "4.3.0"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Required by the UniFFI-generated Kotlin bindings for wooosh-core. The `@aar`
# classifier is mandatory on Android: the plain jar ships desktop native stubs and
# no android-* payload, so Native.load() fails at runtime.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

# QR encode (pairing payload -> Bitmap) — no Play Services (DESIGN.md §3 / PROTOCOL.md §4.2)
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }
# QR scanning activity for the pairing scan path — lightweight, no Play Services
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-embedded" }

activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
material3 = { module = "androidx.compose.material3:material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
